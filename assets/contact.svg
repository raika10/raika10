<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="THANKS — github.com/raika10">
  <defs>
    <radialGradient id="mint" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#B8F5E1"/>
      <stop offset=".45" stop-color="#4FD3AB"/>
      <stop offset="1" stop-color="#22A982"/>
    </radialGradient>
    <radialGradient id="pearl" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F3F6F7"/>
      <stop offset="1" stop-color="#D6DEE2"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ADBB4"/>
      <stop offset="1" stop-color="#2DB88E"/>
    </linearGradient>
    <filter id="card" x="-5%" y="-8%" width="110%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F2933" flood-opacity=".12"/>
    </filter>
    <filter id="sh" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F3D30" flood-opacity=".2"/>
    </filter>
    <clipPath id="clip"><rect x="24" y="20" width="1152" height="352" rx="18"/></clipPath>
    <path id="rail" d="M24 300 C 300 250, 520 350, 780 300 S 1060 260, 1176 300"/>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', 'Hiragino Sans', 'Yu Gothic', Arial, sans-serif; }
    .in   { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .pop  { transform-box: fill-box; transform-origin: center; animation: pop .8s cubic-bezier(.34,1.56,.64,1) both; }
    .f1 { animation: float 6s ease-in-out infinite; }
    .f2 { animation: float2 7.5s ease-in-out -2s infinite; }
    .f3 { animation: float 5s ease-in-out -1s infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    .draw { stroke-dasharray: 1400; animation: draw 2.4s .3s cubic-bezier(.6,0,.2,1) both; }
    @keyframes rise   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes pop    { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(8px,-9px); } }
    @keyframes ping   { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15,1.6); } }
    @keyframes nudge  { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    @keyframes draw   { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }
  </style>

  <rect x="24" y="20" width="1152" height="352" rx="18" fill="#FFFFFF" filter="url(#card)"/>

  <g clip-path="url(#clip)">
    <g fill="none" stroke-linecap="round">
      <path stroke="#C9D3D8" stroke-width="1.2" d="M24 320 C 280 270, 500 370, 760 315 S 1040 280, 1176 320">
        <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
          values="M24 320 C 280 270, 500 370, 760 315 S 1040 280, 1176 320;M24 310 C 280 360, 500 290, 760 330 S 1040 335, 1176 300;M24 320 C 280 270, 500 370, 760 315 S 1040 280, 1176 320"/>
      </path>
      <use href="#rail" class="draw" stroke="#4FD3AB" stroke-opacity=".75" stroke-width="1.6"/>
    </g>
    <g filter="url(#sh)">
      <circle r="7" fill="url(#mint)">
        <animateMotion dur="9s" repeatCount="indefinite" begin="2.5s"><mpath href="#rail"/></animateMotion>
      </circle>
    </g>

    <g filter="url(#sh)">
      <g class="pop" style="animation-delay:.10s"><g class="f1"><circle cx="210" cy="110" r="24" fill="url(#mint)"/></g></g>
      <g class="pop" style="animation-delay:.18s"><g class="f2"><circle cx="300" cy="190" r="10" fill="url(#pearl)"/></g></g>
      <g class="pop" style="animation-delay:.26s"><g class="f3"><circle cx="120" cy="210" r="14" fill="url(#pearl)"/></g></g>
      <g class="pop" style="animation-delay:.34s"><g class="f2"><circle cx="370" cy="80"  r="6"  fill="url(#mint)"/></g></g>
      <g class="pop" style="animation-delay:.14s"><g class="f3"><circle cx="990" cy="100" r="26" fill="url(#mint)"/></g></g>
      <g class="pop" style="animation-delay:.22s"><g class="f1"><circle cx="1080" cy="180" r="12" fill="url(#pearl)"/></g></g>
      <g class="pop" style="animation-delay:.30s"><g class="f2"><circle cx="880" cy="200" r="9"  fill="url(#mint)"/></g></g>
      <g class="pop" style="animation-delay:.38s"><g class="f1"><circle cx="830" cy="72"  r="7"  fill="url(#pearl)"/></g></g>
    </g>

    <g class="sans" text-anchor="middle">
      <text class="in" x="600" y="162" font-size="80" font-weight="800" fill="#1F2933" letter-spacing="6">THANKS</text>
      <text class="in" style="animation-delay:.15s" x="600" y="204" font-size="20" font-weight="600" fill="#2DB88E">for visiting my profile</text>
    </g>

    <g class="in" style="animation-delay:.3s">
      <rect class="ping" x="490" y="228" width="220" height="40" rx="20" fill="none" stroke="#4FD3AB" stroke-width="2"/>
      <rect x="490" y="228" width="220" height="40" rx="20" fill="url(#btn)" filter="url(#sh)"/>
      <text class="sans" x="590" y="253" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing=".5">github.com/raika10</text>
      <g class="arrow" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M676 248h14M684 242l6 6-6 6"/>
      </g>
    </g>
  </g>
</svg>
