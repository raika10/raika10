<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-label="Top Languages">
<defs>
  <linearGradient id="k-hair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
