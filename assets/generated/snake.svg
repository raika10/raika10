<svg xmlns="http://www.w3.org/2000/svg" width="804" height="236" viewBox="0 0 804 236" role="img" aria-label="Contribution Snake">
<defs>
  <linearGradient id="k-hair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
    <stop offset=".35" stop-color="#10B981"/>
    <stop offset=".65" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="k-glow" gradientUnits="userSpaceOnUse" cx="96.5" cy="0" r="442.2">
    <stop offset="0" stop-color="#10B981" stop-opacity=".11"/>
    <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="k-clip"><rect width="804" height="236" rx="14"/></clipPath>
  
</defs>
<style>
  .k-sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .k-mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace}
  .k-in{animation:k-in .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes k-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#k-clip)">
  <rect width="804" height="236" fill="#0B1220"/>
  <rect width="804" height="236" fill="url(#k-glow)"/>
  <rect x="144.7" y="0" width="514.6" height="1" fill="url(#k-hair)"/>
</g>
<rect x=".5" y=".5" width="803" height="235" rx="13.5" fill="none" stroke="#94A3B8" stroke-opacity=".16"/>
<g class="k-mono" font-size="11" letter-spacing="1.6">
  <rect x="24" y="24.5" width="6" height="6" rx="1.5" fill="#10B981"/>
  <text x="38" y="31" fill="#6EE7B7">CONTRIBUTION SNAKE</text>
  <text x="780" y="31" fill="#64748B" text-anchor="end" letter-spacing="1">LAST 12 MONTHS</text>
</g>
<text class="k-mono" x="402" y="134" text-anchor="middle" font-size="11" fill="#64748B" letter-spacing="1">THE SNAKE APPEARS AFTER THE FIRST WORKFLOW RUN</text>
</svg>
