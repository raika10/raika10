<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="raika10 — Hello, I'm raika.">
  <defs>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#DCE8FF"/>
      <stop offset="0.28" stop-color="#7FAEFF"/>
      <stop offset="0.65" stop-color="#2F6BEA"/>
      <stop offset="1" stop-color="#0A1628"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9C7FF"/>
      <stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="540" rx="28"/></clipPath>
  </defs>

  <style>
    .mono  { font-family: 'SF Mono', 'JetBrains Mono', Consolas, Menlo, monospace; }
    .sans  { font-family: 'Helvetica Neue', 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', 'Yu Mincho', serif; }
    .in    { animation: rise 1.2s cubic-bezier(.16,.84,.3,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; } .d4 { animation-delay: .6s; }
    .fade  { animation: fade 1.6s .2s ease-out both; }
    .spin  { transform-origin: 990px 262px; animation: spin 60s linear infinite; }
    .spinr { transform-origin: 990px 262px; animation: spin 22s linear infinite reverse; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="540" fill="#0A1628"/>
    <rect width="1200" height="540" filter="url(#grain)" opacity=".05"/>

    <!-- frame rules -->
    <g stroke="#1C2B45" stroke-width="1">
      <line x1="72" y1="96" x2="1128" y2="96"/>
      <line x1="72" y1="440" x2="1128" y2="440"/>
    </g>

    <!-- masthead -->
    <g class="mono fade" font-size="12" letter-spacing="3" fill="#7F93B2">
      <text x="72" y="64">RAIKA10</text>
      <text x="600" y="64" text-anchor="middle">PERSONAL INDEX</text>
      <text x="1128" y="64" text-anchor="end">VOL. 01 — 2026</text>
    </g>

    <!-- artwork -->
    <g class="fade">
      <g stroke="#1C2B45" stroke-width="1">
        <line x1="800" y1="262" x2="1180" y2="262"/>
        <line x1="990" y1="96" x2="990" y2="440"/>
      </g>
      <circle cx="990" cy="262" r="230" fill="url(#halo)"/>
      <circle cx="990" cy="262" r="128" fill="url(#sphere)"/>
      <g class="spin" fill="none">
        <circle cx="990" cy="262" r="168" stroke="#4C8DFF" stroke-opacity=".55" stroke-dasharray="1 7" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <g class="spinr">
        <circle cx="990" cy="262" r="200" fill="none" stroke="#A9C7FF" stroke-opacity=".18"/>
        <circle cx="1190" cy="262" r="4" fill="#DCE8FF"/>
      </g>
      <g stroke="#7F93B2" stroke-width="1">
        <path d="M818 126h12M824 120v12"/>
        <path d="M1150 404h12M1156 398v12"/>
      </g>
      <text class="mono" x="818" y="420" font-size="10" letter-spacing="2" fill="#7F93B2">FIG. 01 — ORBIT</text>
    </g>

    <!-- headline -->
    <text class="sans in" x="72" y="180" font-size="20" fill="#7F93B2" letter-spacing=".5">Hello, world —</text>
    <text class="serif in d1" x="66" y="300" font-size="124" fill="#E6EEF8" letter-spacing="-3">I’m <tspan font-style="italic" fill="url(#accent)">raika.</tspan></text>
    <text class="sans in d2" x="72" y="358" font-size="19" fill="#B4C3DA">Developer crafting calm, thoughtful things on the web.</text>
    <text class="sans in d3" x="72" y="392" font-size="16" fill="#7F93B2" letter-spacing="2">コードで、心地よいものをつくる。</text>

    <!-- meta row -->
    <g class="in d4">
      <g class="mono" font-size="11" letter-spacing="2.5" fill="#7F93B2">
        <text x="72"  y="482">ROLE</text>
        <text x="452" y="482">BASED IN</text>
        <text x="832" y="482">STATUS</text>
      </g>
      <g class="sans" font-size="17" fill="#E6EEF8">
        <text x="72"  y="510">Developer</text>
        <text x="452" y="510">Japan</text>
        <text x="850" y="510">Open to collaborate</text>
      </g>
      <circle class="pulse" cx="837" cy="504" r="4" fill="#4C8DFF"/>
    </g>
  </g>
</svg>
