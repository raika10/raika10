<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="raika10">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0B1D3A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.08" cy="1" r="0.55">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F9FF"/>
      <stop offset="0.5" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <style>
    .title { font: 800 92px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -3px; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
    .sub   { font: 500 20px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 7px; fill: #93C5FD; animation: rise 1.1s .25s cubic-bezier(.2,.7,.2,1) both; }
    .bar   { animation: grow 1s .45s cubic-bezier(.2,.7,.2,1) both; transform-origin: 84px 0; }
    .ring  { transform-origin: 975px 160px; animation: spin 40s linear infinite; }
    .ring2 { transform-origin: 975px 160px; animation: spin 26s linear infinite reverse; }
    .blink { animation: blink 3.2s ease-in-out infinite; }
    .blink.d1 { animation-delay: .8s; } .blink.d2 { animation-delay: 1.6s; } .blink.d3 { animation-delay: 2.4s; }
    @keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100% { opacity: .9; } 50% { opacity: .2; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- orbit decoration -->
    <g fill="none" stroke-linecap="round">
      <circle cx="975" cy="160" r="70"  stroke="#60A5FA" stroke-opacity=".35"/>
      <circle class="ring"  cx="975" cy="160" r="110" stroke="#93C5FD" stroke-opacity=".45" stroke-dasharray="2 10" stroke-width="2"/>
      <circle class="ring2" cx="975" cy="160" r="150" stroke="#3B82F6" stroke-opacity=".5"  stroke-dasharray="120 60 20 60" stroke-width="1.5"/>
      <circle cx="975" cy="160" r="195" stroke="#1D4ED8" stroke-opacity=".35"/>
    </g>
    <g class="ring2"><circle cx="1125" cy="160" r="5" fill="#93C5FD"/></g>
    <g class="ring"><circle cx="975" cy="50" r="4" fill="#E0F2FE"/></g>
    <circle cx="975" cy="160" r="10" fill="#60A5FA"/>
    <circle cx="975" cy="160" r="22" fill="#60A5FA" fill-opacity=".18"/>

    <!-- stars -->
    <g fill="#E0F2FE">
      <circle class="blink"    cx="640" cy="62"  r="1.6"/>
      <circle class="blink d1" cx="720" cy="248" r="1.4"/>
      <circle class="blink d2" cx="560" cy="276" r="1.2"/>
      <circle class="blink d3" cx="1130" cy="40" r="1.6"/>
      <circle class="blink d1" cx="820" cy="40"  r="1.2"/>
      <circle class="blink d2" cx="1150" cy="290" r="1.4"/>
    </g>

    <!-- text -->
    <text class="title" x="78" y="178" fill="url(#ink)">raika10</text>
    <rect class="bar" x="84" y="204" width="72" height="4" rx="2" fill="#3B82F6"/>
    <text class="sub" x="84" y="252">CODE · CREATE · EXPLORE</text>
  </g>
</svg>
