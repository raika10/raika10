<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="footer">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .dot { animation: slide 6s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(-420px); } to { transform: translateX(420px); } }
  </style>
  <rect x="0" y="19" width="1200" height="2" fill="url(#line)"/>
  <g class="dot">
    <circle cx="600" cy="20" r="10" fill="#3B82F6" fill-opacity=".2"/>
    <circle cx="600" cy="20" r="4"  fill="#BFDBFE"/>
  </g>
</svg>
