<svg xmlns="http://www.w3.org/2000/svg" width="804" height="260" viewBox="0 0 804 260" role="img" aria-label="GitHub Activity Graph">
<defs>
  <linearGradient id="k-hair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
    <stop offset=".35" stop-color="#10B981"/>
    <stop offset=".65" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="k-glow" gradientUnits="userSpaceOnUse" cx="96.5" cy="0" r="442.2">
    <stop offset="0" stop-color="#10B981" stop-opacity=".11"/>
    <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="k-clip"><rect width="804" height="260" rx="14"/></clipPath>
  <linearGradient id="k-lineG" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="776" y2="0">
    <stop offset="0" stop-color="#10B981"/><stop offset=".6" stop-color="#38BDF8"/><stop offset="1" stop-color="#6EE7B7"/>
  </linearGradient>
  <linearGradient id="k-areaG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10B981" stop-opacity=".28"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="k-reveal"><rect x="48" y="0" width="732" height="260">
    <animate attributeName="width" values="12;12;732" dur="2.80s" keyTimes="0;0.1429;1" keySplines="0 0 1 1;0.45 0 0.55 1" calcMode="spline" fill="freeze"/>
  </rect></clipPath>
  <filter id="k-glowF" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .k-sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .k-mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace}
  .k-in{animation:k-in .9s cubic-bezier(.16,1,.3,1) both}
  .k-slide{animation:k-slide .9s cubic-bezier(.16,1,.3,1) both}
  .k-fade{animation:k-fade .8s ease both}
  .k-draw{stroke-dasharray:1;animation:k-draw 1.3s cubic-bezier(.16,1,.3,1) both}
  @keyframes k-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes k-slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  @keyframes k-fade{from{opacity:0}to{opacity:1}}
  @keyframes k-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
