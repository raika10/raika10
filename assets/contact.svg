<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Contact — github.com/raika10">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9C7FF"/>
      <stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="300" rx="28"/></clipPath>
  </defs>

  <style>
    .mono  { font-family: 'SF Mono', 'JetBrains Mono', Consolas, Menlo, monospace; }
    .serif { font-family: Georgia, 'Times New Roman', 'Yu Mincho', serif; }
    .in { animation: rise 1.1s cubic-bezier(.16,.84,.3,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; }
    .arrow { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes nudge { 0%,100% { transform: none; } 50% { transform: translate(3px,-3px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0A1628"/>
    <rect width="1200" height="300" filter="url(#grain)" opacity=".05"/>

    <text class="mono in" x="72" y="84" font-size="12" letter-spacing="3"><tspan fill="#4C8DFF">03</tspan><tspan fill="#7F93B2"> — CONTACT</tspan></text>
    <text class="serif in d1" x="68" y="170" font-size="58" fill="#E6EEF8" letter-spacing="-1.5">Let’s make something <tspan font-style="italic" fill="url(#accent)">beautiful.</tspan></text>

    <g class="in d2">
      <line x1="72" y1="214" x2="1128" y2="214" stroke="#1C2B45"/>
      <text class="mono" x="72" y="252" font-size="13" letter-spacing="2.5" fill="#E6EEF8">GITHUB.COM/RAIKA10</text>
      <g class="arrow" stroke="#4C8DFF" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M262 254l10-10M264 244h8v8"/>
      </g>
      <text class="mono" x="1128" y="252" font-size="11" letter-spacing="2.5" fill="#7F93B2" text-anchor="end">© 2026 RAIKA10</text>
    </g>
  </g>
</svg>
