    <stop offset=".65" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="k-glow" gradientUnits="userSpaceOnUse" cx="48" cy="0" r="240">
