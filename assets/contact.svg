<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="THANKS — github.com/raika10">
<defs>
<filter id="card" x="-5%" y="-8%" width="110%" height="125%">
  <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F2933" flood-opacity=".12"/>
</filter>
<filter id="sh" x="-30%" y="-60%" width="160%" height="240%">
  <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1F2933" flood-opacity=".2"/>
</filter>
<filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
  <feGaussianBlur stdDeviation="2.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#009B58"/><stop offset="1" stop-color="#009B58"/>
</linearGradient>
<clipPath id="clip"><rect x="24" y="20" width="1152" height="352" rx="18"/></clipPath><linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="-40" y1="0" x2="1240" y2="0"><stop offset="0" stop-color="#009B58" stop-opacity="0"/><stop offset=".25" stop-color="#009B58"/><stop offset=".7" stop-color="#009B58"/><stop offset="1" stop-color="#009B58" stop-opacity="0"/></linearGradient><linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="-40" y1="0" x2="560" y2="0"><stop offset="0" stop-color="#009B58" stop-opacity="0"/><stop offset=".25" stop-color="#009B58"/><stop offset=".7" stop-color="#009B58"/><stop offset="1" stop-color="#009B58" stop-opacity="0"/></linearGradient></defs>
<style>
.sans { font-family: 'Segoe UI', 'Helvetica Neue', 'Hiragino Sans', 'Yu Gothic', Arial, sans-serif; }
.in   { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.draw { stroke-dasharray: 1000; animation: draw 2.6s cubic-bezier(.65,0,.25,1) both; }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
.bar  { transform-box: fill-box; transform-origin: left; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
@keyframes ping { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15,1.6); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.arrow { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }</style>
