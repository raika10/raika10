<svg xmlns="http://www.w3.org/2000/svg" width="420" height="52" viewBox="0 0 420 52" role="img" aria-label="Claude が歩くバー">
<defs>
  <linearGradient id="wk-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132036"/><stop offset="1" stop-color="#0D1626"/></linearGradient>
  <radialGradient id="wk-a" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(50.4 26) scale(134.4 104)"><stop offset="0" stop-color="#10B981" stop-opacity=".22"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
  <radialGradient id="wk-b" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(361.2 26) scale(126 104)"><stop offset="0" stop-color="#38BDF8" stop-opacity=".18"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
  <clipPath id="wk-clip"><rect width="420" height="52" rx="14"/></clipPath>
</defs>
<style>
  .wk-walk{animation:wk-walk 13.72s linear infinite}
  @keyframes wk-walk{0%{transform:translateX(0)}73.10%{transform:translateX(401.0px);animation-timing-function:steps(1,end)}89.14%{transform:translateX(-59.6px);animation-timing-function:linear}100%{transform:translateX(0)}}
  .wk-a{animation:wk-a 0.32s steps(1,end) infinite} @keyframes wk-a{0%{opacity:1}50%{opacity:0}}
  .wk-b{opacity:0;animation:wk-b 0.32s steps(1,end) infinite} @keyframes wk-b{0%{opacity:0}50%{opacity:1}}
  .wk-bob{animation:wk-bob 0.32s steps(1,end) infinite} @keyframes wk-bob{0%{transform:translateY(0)}50%{transform:translateY(-1.30px)}}
  .wk-eye{transform-box:fill-box;transform-origin:center;animation:wk-blink 4.6s infinite}
  @keyframes wk-blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.15)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#wk-clip)">
  <rect width="420" height="52" fill="url(#wk-bg)"/>
  <rect width="420" height="52" fill="url(#wk-a)"/>
  <rect width="420" height="52" fill="url(#wk-b)"/>
  <rect width="420" height="1" fill="#FFFFFF" fill-opacity=".07"/>
  <g transform="translate(25 18.20)">
    <g class="wk-walk">
      <ellipse cx="14.3" cy="19.24" rx="10.920000000000002" ry="1.8199999999999998" fill="#000000" fill-opacity=".35"/>
      <g fill="#D97757" shape-rendering="crispEdges">
        <g class="wk-bob"><rect x="5.2" y="0" width="18.2" height="13"/><rect x="0" y="5.2" width="5.2" height="2.6"/><rect x="23.400000000000002" y="5.2" width="5.2" height="2.6"/><g class="wk-eye" fill="#1A1310"><rect x="10.4" y="2.6" width="2.6" height="5.2"/><rect x="18.2" y="2.6" width="2.6" height="5.2"/></g></g>
        <g class="wk-a"><rect x="5.2" y="10.4" width="2.6" height="7.800000000000001"/><rect x="10.4" y="10.4" width="2.6" height="5.2"/><rect x="15.600000000000001" y="10.4" width="2.6" height="7.800000000000001"/><rect x="20.8" y="10.4" width="2.6" height="5.2"/></g>
        <g class="wk-b"><rect x="5.2" y="10.4" width="2.6" height="5.2"/><rect x="10.4" y="10.4" width="2.6" height="7.800000000000001"/><rect x="15.600000000000001" y="10.4" width="2.6" height="5.2"/><rect x="20.8" y="10.4" width="2.6" height="7.800000000000001"/></g>
      </g>
    </g>
  </g>
</g>
<rect x=".5" y=".5" width="419" height="51" rx="13.5" fill="none" stroke="#94A3B8" stroke-opacity=".16"/>
</svg>
