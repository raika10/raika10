name: Menu Bar

on:
  schedule:
    # 30 分ごと（毎時 7 分・37 分）。GitHub が混む毎時 0 分を避けても、間引かれて数時間あくことがある
    - cron: "7,37 * * * *"
  workflow_dispatch: # Actions タブから手動実行
  push:
    branches: [main]
    paths:
      - ".github/workflows/menubar.yml"
      - ".github/scripts/menubar.mjs"

permissions:
  contents: write

concurrency:
  group: menubar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate menu bar
        run: node .github/scripts/menubar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: out

      # 毎時間の更新で main の履歴が埋まらないよう、画像は status ブランチに 1 コミットだけ置いて上書きする
      - name: Publish to status branch
        working-directory: out
        run: |
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update menu bar"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
