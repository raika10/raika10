<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>raika10 room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/*
 * README 用「作業部屋のミニチュア」
 * ・?preview=1 で開くと、ブラウザ上でそのまま動く
 * ・render-room.mjs は window.renderAt(t) で時刻を指定して 1 コマずつ撮影し、ループする WebP にする
 *   （README では JavaScript が動かないため、動きはすべて画像に焼き込む）
 * ・ループは 12 秒。CSS アニメーションの周期は、すべて 12 秒を割り切れる長さにしてある
 */
html, body { margin: 0; background: transparent; }
.stage { position: relative; width: 804px; height: 380px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(148,163,184,.16); background: #0B1220; }
svg { display: block; width: 100%; height: 100%; }
.steam path { stroke-dasharray: 26; animation: steam 3s ease-in-out infinite; }
.steam path:nth-child(2) { animation-delay: -1s; } .steam path:nth-child(3) { animation-delay: -2s; }
@keyframes steam { 0% { stroke-dashoffset: 26; opacity: 0; } 40% { opacity: .65; } 100% { stroke-dashoffset: -26; opacity: 0; } }
.neon { animation: neon 12s steps(1) infinite; }
@keyframes neon { 0%, 36%, 38.5%, 100% { opacity: 1; } 36.5%, 38% { opacity: .55; } }
.twinkle { animation: tw 3s steps(1) infinite; }
@keyframes tw { 50% { opacity: .25; } }
.plant { animation: sway 6s ease-in-out infinite alternate; }
@keyframes sway { from { rotate: -3deg; } to { rotate: 3deg; } }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.lead { stroke-dasharray: 3 4; animation: lead 1.2s linear infinite; }
@keyframes lead { to { stroke-dashoffset: -7; } }
</style>
</head>
<body>
<div class="stage" id="stage"><svg id="room" viewBox="0 0 804 380" role="img" aria-label="作業部屋のミニチュアと Claude Code のターミナル"></svg></div>
<script>
(() => {
  const LOOP = 12;
  const svg = document.getElementById("room");
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, a = {}, parent = svg) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); parent.appendChild(n); return n; };
  const txt = (parent, a, s) => { const t = el("text", a, parent); t.textContent = s; return t; };

  // 等角投影：x は右下、y は左下、z は上
  const s = 22, ox = 292, oy = 172;
  const P = (x, y, z) => [ox + (x - y) * 0.866 * s, oy + (x + y) * 0.5 * s - z * s];
  const pts = (arr) => arr.map((p) => P(...p).map((v) => v.toFixed(1)).join(",")).join(" ");
  const poly = (parent, arr, fill, extra = {}) => el("polygon", { points: pts(arr), fill, ...extra }, parent);
  const box = (parent, x0, y0, z0, x1, y1, z1, top, left, right) => {
    poly(parent, [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], left);
    poly(parent, [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], right);
    poly(parent, [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], top);
  };
  const mat = (X, Y, a, b) => `matrix(${a},${b},0,1,${X.toFixed(1)},${Y.toFixed(1)})`;
  const onRight = (x, z) => { const [X, Y] = P(x, 0.02, z); return mat(X, Y, 0.866, 0.5); };
  const onLeft = (y, z) => { const [X, Y] = P(0.02, y, z); return mat(X, Y, 0.866, -0.5); };
  const onFront = (x, y, z) => { const [X, Y] = P(x, y, z); return mat(X, Y, 0.866, 0.5); };

  // ---------- 定義 ----------
  const defs = el("defs");
  const radial = (id, color, op) => { const g = el("radialGradient", { id }, defs); el("stop", { offset: "0", "stop-color": color, "stop-opacity": op }, g); el("stop", { offset: "1", "stop-color": color, "stop-opacity": "0" }, g); };
  radial("g-lamp", "#FDBA74", ".5"); radial("g-mon", "#38BDF8", ".42"); radial("g-neon", "#D97757", ".55"); radial("g-bg", "#10B981", ".10");
  const night = el("linearGradient", { id: "g-night", x1: "0", y1: "0", x2: "0", y2: "1" }, defs);
  el("stop", { offset: "0", "stop-color": "#1A2350" }, night); el("stop", { offset: "1", "stop-color": "#0D1730" }, night);
  const wood = el("radialGradient", { id: "g-wood", cx: ".45", cy: ".4", r: ".7" }, defs);
  el("stop", { offset: "0", "stop-color": "#E6AE6A" }, wood); el("stop", { offset: ".7", "stop-color": "#C27A3A" }, wood); el("stop", { offset: "1", "stop-color": "#8E5126" }, wood);
  const blur = el("filter", { id: "f-blur", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs); el("feGaussianBlur", { stdDeviation: "10" }, blur);
  const glow = el("filter", { id: "f-glow", x: "-50%", y: "-100%", width: "200%", height: "300%" }, defs);
  el("feGaussianBlur", { stdDeviation: "2.2", result: "b" }, glow); const mg = el("feMerge", {}, glow); el("feMergeNode", { in: "b" }, mg); el("feMergeNode", { in: "SourceGraphic" }, mg);

  // ---------- 背景・見出し ----------
  el("rect", { width: 804, height: 380, fill: "#0B1220" });
  el("ellipse", { cx: 300, cy: 190, rx: 300, ry: 200, fill: "url(#g-bg)" });
  txt(svg, { x: 26, y: 38, fill: "#6EE7B7", "font-family": "JetBrains Mono, monospace", "font-size": 11, "letter-spacing": 3 }, "RAIKA10'S ROOM");
  const sub = txt(svg, { x: 26, y: 56, fill: "#94A3B8", "font-family": "JetBrains Mono, monospace", "font-size": 9.5 }, "");
  sub.innerHTML = `<tspan fill="#D97757">✻</tspan> built with Claude Code`;
  txt(svg, { x: 26, y: 352, fill: "#64748B", "font-family": "JetBrains Mono, monospace", "font-size": 9 }, "LATE-NIGHT CODING · TOKYO");
  el("ellipse", { cx: 292, cy: 362, rx: 150, ry: 12, fill: "#000", opacity: .5, filter: "url(#f-blur)" });

  const room = el("g");

  // ---------- 台座・床・壁 ----------
  box(room, 0, 0, -0.6, 8, 8, 0, "#18263F", "#0E1729", "#121D33");
  poly(room, [[0, 0, 0], [8, 0, 0], [8, 0, 6.6], [0, 0, 6.6]], "#14223A");
  poly(room, [[0, 0, 0], [0, 8, 0], [0, 8, 6.6], [0, 0, 6.6]], "#101C31");
  poly(room, [[0, -0.3, 6.6], [8, -0.3, 6.6], [8, 0, 6.6], [0, 0, 6.6]], "#26375A");
  poly(room, [[-0.3, -0.3, 6.6], [0, -0.3, 6.6], [0, 8, 6.6], [-0.3, 8, 6.6]], "#26375A");
  poly(room, [[8, -0.3, -0.6], [8, 0, -0.6], [8, 0, 6.6], [8, -0.3, 6.6]], "#0C1526");
  poly(room, [[-0.3, 8, -0.6], [0, 8, -0.6], [0, 8, 6.6], [-0.3, 8, 6.6]], "#0A1322");
  for (let i = 1; i < 8; i++) el("polyline", { points: pts([[i, 0, 0], [i, 8, 0]]), stroke: "#1E2E4A", "stroke-width": .8, fill: "none" }, room);
  poly(room, [[1.0, 3.0, .01], [6.8, 3.0, .01], [6.8, 7.4, .01], [1.0, 7.4, .01]], "#10B981", { opacity: ".14" });
  poly(room, [[1.3, 3.3, .02], [6.5, 3.3, .02], [6.5, 7.1, .02], [1.3, 7.1, .02]], "none", { stroke: "#6EE7B7", "stroke-opacity": ".25", "stroke-width": 1 });

  // ---------- 左の壁：窓・本棚・ネオン ----------
  poly(room, [[0, 4.4, 5.6], [0, 7.3, 5.6], [0, 7.3, 2.8], [0, 4.4, 2.8]], "url(#g-night)", { stroke: "#2C3E5E", "stroke-width": 2.2 });
  const city = el("g", { transform: onLeft(7.25, 3.9) }, room);
  [[4, 10, 8], [14, 6, 12], [22, 12, 6], [34, 4, 14], [44, 9, 9], [54, 5, 13]].forEach(([x, w, h]) => el("rect", { x, y: 18 - h, width: w, height: h + 6, fill: "#0A1226" }, city));
  [[6, 14], [16, 9], [24, 12], [36, 6], [46, 13], [56, 9], [17, 15]].forEach(([x, y], i) => el("rect", { x, y, width: 1.6, height: 1.6, fill: i % 2 ? "#6EE7B7" : "#38BDF8", class: "twinkle", style: `animation-delay:${-i * .5}s` }, city));
  const sky = el("g", { transform: onLeft(7.25, 5.5) }, room);
  el("path", { d: "M50 10 a6 6 0 1 0 6 -8 a4.6 4.6 0 1 1 -6 8 z", fill: "#F4F1D0" }, sky);
  [[10, 6], [24, 12], [36, 4]].forEach(([x, y], i) => el("rect", { x, y, width: 1.4, height: 1.4, fill: "#F8FAFC", class: "twinkle", style: `animation-delay:${-i * 1}s` }, sky));
  box(room, 0, 0.9, 3.8, 0.7, 3.7, 3.95, "#33476A", "#22314C", "#2A3B58");
  let by = 1.0;
  [["#4C8FE0", .9, .34], ["#8B6FE8", .85, .34], ["#E8D44D", .75, .28], ["#C2853A", .8, .26], ["#3D6FB0", .65, .22], ["#6B57BF", .7, .22]].forEach(([c, h, w]) => {
    box(room, 0.05, by, 3.95, 0.55, by + w, 3.95 + h, c, c, c);
    poly(room, [[0.05, by + w, 3.95], [0.55, by + w, 3.95], [0.55, by + w, 3.95 + h], [0.05, by + w, 3.95 + h]], "#000", { opacity: ".25" });
    by += w + 0.03;
  });
  el("ellipse", { cx: P(0, 2.4, 5.4)[0], cy: P(0, 2.4, 5.4)[1], rx: 62, ry: 40, fill: "url(#g-neon)", style: "mix-blend-mode:screen" }, room);
  const neon = el("g", { transform: onLeft(3.55, 5.25), class: "neon", filter: "url(#f-glow)" }, room);
  txt(neon, { x: 0, y: 0, fill: "#F2A385", "font-family": "JetBrains Mono, monospace", "font-size": 11, "font-weight": 700 }, "✻ thinking…");

  // ---------- 右の壁：時計（夜 23:40） ----------
  const clock = el("g", { transform: onRight(7.0, 5.3) }, room);
  el("circle", { cx: 0, cy: 0, r: 11, fill: "#0B1220", stroke: "#94A3B8", "stroke-width": 1.6 }, clock);
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", { x1: Math.sin(a) * 8.5, y1: -Math.cos(a) * 8.5, x2: Math.sin(a) * 10, y2: -Math.cos(a) * 10, stroke: "#64748B", "stroke-width": 1 }, clock); }
  el("line", { x1: 0, y1: 0, x2: 0, y2: -5.5, stroke: "#E8EEF6", "stroke-width": 1.8, "stroke-linecap": "round", transform: `rotate(${(11 + 40 / 60) * 30})` }, clock);
  el("line", { x1: 0, y1: 0, x2: 0, y2: -8.5, stroke: "#6EE7B7", "stroke-width": 1.2, "stroke-linecap": "round", transform: `rotate(${40 * 6})` }, clock);

  // ---------- 机・モニター ----------
  box(room, 0.8, 0, 3.6, 6.6, 2.4, 3.9, "#2E4163", "#1F2D47", "#26375A");
  [[0.95, 2.1], [4.9, 2.1]].forEach(([x, y]) => box(room, x, y, 0, x + 0.22, y + 0.22, 3.6, "#2E4163", "#1A263D", "#22314C"));
  box(room, 5.2, 0.2, 0, 6.4, 2.2, 3.6, "#2E4163", "#1C2942", "#24344F");
  poly(room, [[5.25, 2.2, 2.4], [6.35, 2.2, 2.4], [6.35, 2.2, 2.45], [5.25, 2.2, 2.45]], "#3B5078");
  el("ellipse", { cx: P(3.5, 0.6, 4.6)[0], cy: P(3.5, 0.6, 4.6)[1], rx: 95, ry: 55, fill: "url(#g-mon)", style: "mix-blend-mode:screen" }, room);
  box(room, 3.2, 0.5, 3.9, 3.8, 0.9, 4.35, "#334155", "#1E293B", "#273449");
  box(room, 1.3, 0.25, 4.35, 5.7, 0.55, 6.25, "#334155", "#0F172A", "#1E293B");
  poly(room, [[1.42, 0.56, 6.13], [5.58, 0.56, 6.13], [5.58, 0.56, 4.47], [1.42, 0.56, 4.47]], "#060D18");
  const scr = el("g", { transform: onFront(1.5, 0.57, 6.06), "font-family": "JetBrains Mono, monospace" }, room);
  el("rect", { x: 2, y: 2, width: 34, height: 7, rx: 1.5, fill: "none", stroke: "#D97757", "stroke-width": .7 }, scr);
  txt(scr, { x: 4.5, y: 7.2, fill: "#D97757", "font-size": 4.6 }, "✻ Claude Code");
  [[12.5, 40, "#E8EEF6"], [17.5, 28, "#6EE7B7"], [22.5, 52, "#94A3B8"], [27.5, 34, "#6EE7B7"]].forEach(([y, w, c]) => el("rect", { x: 3, y, width: w, height: 1.6, rx: .8, fill: c, opacity: .8 }, scr));
  const miniSpin = txt(scr, { x: 3, y: 34.5, fill: "#D97757", "font-size": 5.2 }, "✻");
  const miniWord = txt(scr, { x: 9, y: 34.5, fill: "#D97757", "font-size": 4.4 }, "Brewing…");
  box(room, 2.4, 1.3, 3.9, 4.6, 1.95, 3.98, "#CBD5E1", "#94A3B8", "#A8B3C2");
  box(room, 5.0, 1.15, 3.9, 5.5, 1.65, 4.55, "#D97757", "#B85F42", "#C76A4B");
  const mug = el("g", { transform: onFront(5.08, 1.66, 4.42) }, room);
  txt(mug, { x: 1.4, y: 6, fill: "#FDE7DD", "font-size": 6.5, "font-family": "JetBrains Mono, monospace" }, "✻");
  const steam = el("g", { class: "steam", fill: "none", stroke: "#CBD5E1", "stroke-width": 1.3, "stroke-linecap": "round" }, room);
  const [mx, my] = P(5.25, 1.4, 4.6);
  [-3, 0, 3].forEach((dx) => el("path", { d: `M${mx + dx} ${my} q -3 -6 0 -11 q 3 -6 0 -11`, opacity: 0 }, steam));

  // ---------- 椅子 ----------
  box(room, 3.0, 3.85, 0, 3.25, 4.1, 1.8, "#334155", "#1E293B", "#273449");
  box(room, 2.3, 3.1, 1.8, 4.1, 4.9, 2.15, "#14B88A", "#0B6B50", "#0E8A65");
  box(room, 2.3, 4.9, 2.15, 4.1, 5.2, 4.3, "#14B88A", "#0B6B50", "#0E8A65");

  // ---------- ギター ----------
  const [gsx, gsy] = P(1.75, 6.65, 0);
  el("ellipse", { cx: gsx, cy: gsy, rx: 22, ry: 7, fill: "#000", opacity: .35, filter: "url(#f-blur)" }, room);
  const [gx, gy] = P(1.0, 6.6, 4.3);
  const gtr = el("g", { transform: `${mat(gx, gy, 0.866, 0.5)} rotate(-7 17 94)` }, room);
  el("path", { d: "M8 92 L2 100 M26 92 L32 100", stroke: "#334155", "stroke-width": 2, "stroke-linecap": "round" }, gtr);
  el("path", { d: "M12 2 Q17 -1 22 2 L21 15 L13 15 Z", fill: "#3B2414" }, gtr);
  [4, 8, 12].forEach((y) => { el("rect", { x: 10, y, width: 2.4, height: 1.6, rx: .6, fill: "#CBD5E1" }, gtr); el("rect", { x: 21.6, y, width: 2.4, height: 1.6, rx: .6, fill: "#CBD5E1" }, gtr); });
  el("rect", { x: 14, y: 14, width: 6, height: 44, fill: "#5B3A1E" }, gtr);
  for (let fy = 19; fy < 56; fy += 5) el("line", { x1: 14, y1: fy, x2: 20, y2: fy, stroke: "#D6C29A", "stroke-width": .5, opacity: .7 }, gtr);
  el("ellipse", { cx: 17, cy: 63, rx: 12, ry: 10.5, fill: "url(#g-wood)", stroke: "#6E3B18", "stroke-width": 1 }, gtr);
  el("ellipse", { cx: 17, cy: 81, rx: 16, ry: 14, fill: "url(#g-wood)", stroke: "#6E3B18", "stroke-width": 1 }, gtr);
  el("ellipse", { cx: 17, cy: 71, rx: 10.5, ry: 6, fill: "url(#g-wood)" }, gtr);
  el("circle", { cx: 17, cy: 66, r: 5.4, fill: "none", stroke: "#6E3B18", "stroke-width": 1.2 }, gtr);
  el("circle", { cx: 17, cy: 66, r: 4.2, fill: "#24130A" }, gtr);
  el("path", { d: "M22 70 Q28 72 27 80 Q24 76 21 74 Z", fill: "#3B2414", opacity: .55 }, gtr);
  el("rect", { x: 10.5, y: 85, width: 13, height: 2.6, rx: 1, fill: "#3B2414" }, gtr);
  [15.6, 17, 18.4].forEach((x) => el("line", { x1: x, y1: 3, x2: x, y2: 86, stroke: "#EDE3C8", "stroke-width": .45, opacity: .85 }, gtr));

  // ---------- 観葉植物 ----------
  box(room, 6.9, 0.4, 0, 7.7, 1.2, 1.0, "#C2853A", "#94622A", "#A87132");
  const [px, py] = P(7.3, 0.8, 1.0);
  const plant = el("g", { class: "plant", style: `transform-origin:${px}px ${py}px` }, room);
  [[-34, 0, 15], [-12, -2, 18], [10, -1, 19], [32, 1, 15], [-22, 4, 12], [22, 4, 12]].forEach(([rot, lift, len], i) =>
    el("ellipse", { cx: px, cy: py - len + lift, rx: 4.6, ry: len, fill: i % 2 ? "#10B981" : "#0E8A62", transform: `rotate(${rot} ${px} ${py})` }, plant));

  // ---------- フロアランプ ----------
  const [lb1, lb2] = [P(0.9, 7.0, 0), P(0.9, 7.0, 5.0)];
  el("ellipse", { cx: lb2[0], cy: lb2[1] + 30, rx: 120, ry: 90, fill: "url(#g-lamp)", style: "mix-blend-mode:screen" }, room);
  el("line", { x1: lb1[0], y1: lb1[1], x2: lb2[0], y2: lb2[1], stroke: "#94A3B8", "stroke-width": 2 }, room);
  el("ellipse", { cx: lb1[0], cy: lb1[1], rx: 9, ry: 4.5, fill: "#334155" }, room);
  el("path", { d: `M${lb2[0] - 15} ${lb2[1] + 9} L${lb2[0] - 9} ${lb2[1] - 7} L${lb2[0] + 9} ${lb2[1] - 7} L${lb2[0] + 15} ${lb2[1] + 9} Z`, fill: "#FCD9A8" }, room);

  // ---------- 吹き出し：Claude Code のターミナル ----------
  const [sx, sy] = P(4.2, 0.56, 5.6);
  el("path", { class: "lead", d: `M${sx} ${sy} C ${sx + 60} ${sy - 30}, 460 92, 506 92`, fill: "none", stroke: "#D97757", "stroke-width": 1.2, opacity: .8 });
  el("circle", { cx: sx, cy: sy, r: 2.6, fill: "#D97757" });
  const card = el("g", { "font-family": "JetBrains Mono, Noto Sans JP, monospace" });
  el("rect", { x: 506, y: 64, width: 276, height: 258, rx: 12, fill: "#070C16", stroke: "#2A3A55" }, card);
  el("rect", { x: 506, y: 64, width: 276, height: 24, rx: 12, fill: "#0E1626" }, card);
  el("rect", { x: 506, y: 80, width: 276, height: 8, fill: "#0E1626" }, card);
  [0, 1, 2].forEach((i) => el("circle", { cx: 522 + i * 11, cy: 76, r: 3.2, fill: "#334155" }, card));
  txt(card, { x: 644, y: 80, fill: "#64748B", "font-size": 8.5, "text-anchor": "middle" }, "~/raika10 — claude");
  el("rect", { x: 518, y: 98, width: 252, height: 34, rx: 5, fill: "none", stroke: "#D97757", "stroke-width": 1 }, card);
  const w1 = txt(card, { x: 528, y: 113, "font-size": 9.5, fill: "#E8EEF6" }, ""); w1.innerHTML = `<tspan fill="#D97757">✻</tspan> Welcome to <tspan font-weight="700">Claude Code</tspan>!`;
  txt(card, { x: 540, y: 126, "font-size": 8, fill: "#64748B" }, "cwd: ~/raika10");
  const lines = [];
  const L = (y, html) => { const t = txt(card, { x: 520, y, "font-size": 9, fill: "#CBD5E1" }, ""); t.innerHTML = html; lines.push(t); return t; };
  const prompt = L(152, "");
  L(174, `<tspan fill="#6EE7B7">⏺</tspan> Write(<tspan fill="#E8EEF6">room/room.html</tspan>)`);
  L(188, `<tspan fill="#64748B">  ⎿  Wrote 214 lines</tspan>`);
  L(206, `<tspan fill="#6EE7B7">⏺</tspan> Bash(<tspan fill="#E8EEF6">npm run build:room</tspan>)`);
  L(220, `<tspan fill="#64748B">  ⎿  ✓ room.webp updated</tspan>`);
  L(238, `<tspan fill="#6EE7B7">⏺</tspan> 作業部屋をおしゃれにしました。`);
  const status = txt(card, { x: 520, y: 268, "font-size": 9.5, fill: "#D97757" }, "");
  el("line", { x1: 518, y1: 292, x2: 770, y2: 292, stroke: "#1E293B" }, card);
  txt(card, { x: 520, y: 306, "font-size": 8, fill: "#475569" }, "opus · ~/raika10 · main");

  // ---------- 時刻 t（秒）の状態を描く ----------
  const ASK = "作業部屋をもっとおしゃれにして";
  const T_TYPE = 0.4, CHAR = 0.09, T_LINES = [2.6, 3.6, 4.6, 5.6, 6.8], T_CLEAR = 11.6;
  const FRAMES = ["·", "✢", "✳", "✶", "✻", "✽", "✻", "✶", "✳", "✢"];
  const WORDS = ["Brewing…", "Crafting…", "Pondering…", "Polishing…"];
  function state(t) {
    t = ((t % LOOP) + LOOP) % LOOP;
    const typedN = Math.max(0, Math.min(ASK.length, Math.floor((t - T_TYPE) / CHAR) + 1));
    const typing = t >= T_TYPE && typedN < ASK.length;
    const cleared = t >= T_CLEAR;
    prompt.innerHTML = cleared ? `<tspan fill="#94A3B8">&gt;</tspan> <tspan fill="#E8EEF6">▍</tspan>`
      : `<tspan fill="#94A3B8">&gt;</tspan> ${ASK.slice(0, t >= T_TYPE ? typedN : 0)}${typing || t < T_TYPE ? '<tspan fill="#E8EEF6">▍</tspan>' : ""}`;
    T_LINES.forEach((at, i) => { lines[i + 1].style.opacity = !cleared && t >= at ? 1 : 0; });
    const frame = FRAMES[Math.floor(t / 0.12) % FRAMES.length];
    const word = WORDS[Math.floor(t / 3) % WORDS.length];
    const working = t >= T_TYPE + ASK.length * CHAR && t < T_LINES[4];
    const done = t >= T_LINES[4] && !cleared;
    if (working) status.innerHTML = `${frame} ${word} <tspan fill="#64748B">(${Math.floor(t - 1.8)}s · esc to interrupt)</tspan>`;
    else if (done) status.innerHTML = `<tspan fill="#6EE7B7">✓</tspan> <tspan fill="#94A3B8">Done · 5s</tspan>`;
    else status.innerHTML = "";
    miniSpin.textContent = frame;
    miniWord.textContent = done ? "Done" : word;
  }

  // 撮影用：CSS アニメーションも同じ時刻に合わせて止める
  window.renderAt = (t) => {
    state(t);
    document.getAnimations().forEach((a) => { a.pause(); a.currentTime = (((t % LOOP) + LOOP) % LOOP) * 1000; });
  };
  window.LOOP = LOOP;

  if (new URLSearchParams(location.search).get("preview")) {
    const start = performance.now();
    const tick = (now) => { state(((now - start) / 1000) % LOOP); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  } else state(0);
  window.ready = true;
})();
</script>
</body>
</html>
