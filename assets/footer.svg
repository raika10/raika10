<svg xmlns="http://www.w3.org/2000/svg" width="804" height="40" viewBox="0 0 804 40" role="img" aria-label="">
<defs>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
    <stop offset=".3" stop-color="#10B981" stop-opacity=".55"/>
    <stop offset=".7" stop-color="#38BDF8" stop-opacity=".55"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EE7B7" stop-opacity="0"/>
    <stop offset=".8" stop-color="#6EE7B7"/>
    <stop offset="1" stop-color="#F8FAFC"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-400%" width="140%" height="900%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .run{opacity:0;animation:run 7s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes run{0%{transform:translateX(-140px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(804px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.run{animation:none;opacity:0}}
</style>
<rect x="0" y="19.5" width="804" height="1" fill="url(#hair)"/>
<g class="run" filter="url(#glow)"><rect x="0" y="19" width="140" height="2" rx="1" fill="url(#spark)"/></g>
</svg>
