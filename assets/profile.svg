<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="About Me / My Toolkit">
<defs>
<filter id="card" x="-5%" y="-8%" width="110%" height="125%">
  <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F2933" flood-opacity=".12"/>
</filter>
<filter id="sh" x="-30%" y="-60%" width="160%" height="240%">
  <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F3D30" flood-opacity=".2"/>
</filter>
<filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
  <feGaussianBlur stdDeviation="2.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#5ADBB4"/><stop offset="1" stop-color="#2DB88E"/>
</linearGradient>
<clipPath id="clip"><rect x="24" y="20" width="1152" height="532" rx="18"/></clipPath><linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1240" y2="0"><stop offset="0" stop-color="#4FD3AB" stop-opacity="0"/><stop offset=".25" stop-color="#4FD3AB"/><stop offset=".7" stop-color="#2DB88E"/><stop offset="1" stop-color="#2DB88E" stop-opacity="0"/></linearGradient><linearGradient id="gw" gradientUnits="userSpaceOnUse" x1="-20" y1="0" x2="470" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".25" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ADBB4"/><stop offset="1" stop-color="#26AF86"/></linearGradient>
<linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FD3AB"/><stop offset="1" stop-color="#2DB88E"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F2933" flood-opacity=".1"/></filter></defs>
<style>
.sans { font-family: 'Segoe UI', 'Helvetica Neue', 'Hiragino Sans', 'Yu Gothic', Arial, sans-serif; }
.in   { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.draw { stroke-dasharray: 1000; animation: draw 2.6s cubic-bezier(.65,0,.25,1) both; }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
.bar  { transform-box: fill-box; transform-origin: left; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
@keyframes ping { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15,1.6); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide { animation: slide 1s cubic-bezier(.2,.8,.2,1) both; }
.card  { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
.spin  { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
@keyframes slide { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes spin  { to { transform: rotate(360deg); } }</style>
<rect x="24" y="20" width="1152" height="532" rx="18" fill="#FFFFFF" filter="url(#card)"/>
